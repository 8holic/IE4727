<!DOCTYPE html>  <!--Declare markdown Syntax-->
<html lang="en">   
<head><!--Declare Head Segment-->
     <title>My First Web Page</title><!--Declare text to be displayed in title bar-->
     <meta charset="utf-8"> <!--Descrbie character encoding-->
</head> <!--Contain body Segment-->
<body>

<h1>My Favorite Color</h1>

<!-- type="1" = default, numbers (1, 2, 3) | CSS: list-style-type: decimal -->
<ol type="1">
     <li>Blue</li>
     <li>Teal</li>
     <li>Red</li>
</ol>


<!-- type="A" = uppercase letters (A, B, C) | CSS: list-style-type: upper-alpha -->
<ol type="A"><!--typo fixed: was <o1>-->
     <li>Blue</li>
     <li>Teal</li>
     <li>Red</li>
</ol>



<!-- type="a" = lowercase letters (a, b, c) | CSS: list-style-type: lower-alpha -->
<ol type="a">
     <li>Blue</li>
     <li>Teal</li>
     <li>Red</li>
</ol>



<!-- type="i" = lowercase roman numerals (i, ii, iii) | CSS: list-style-type: lower-roman -->
<ol type="i">
     <li>Blue</li>
     <li>Teal</li>
     <li>Red</li>
</ol>



<!-- start="6" = begin numbering at 6 (type="6" was a typo; start is the correct attribute) -->
<ol start="6">
     <li>Blue</li>
     <li>Teal</li>
     <li>Red</li>
</ol>


<!-- NEWER/CSS VERSION: type on <ol> is deprecated; use CSS list-style-type instead -->
<ol style="list-style-type: lower-alpha">
     <li>Blue</li>
     <li>Teal</li>
     <li>Red</li>
</ol>



</body>
</html>
